<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.css">
  <link rel="stylesheet" href="css/allMobile.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <title>Roller</title>
</head>

<body>
  <div id="appView" class="admin" data-testid="admin-dashboard">
    <aside class="sidebar">
      <div class="side-head">
        <a href="index.html" class="logo">ScooterFleet<span>.</span></a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menü megnyitása" aria-expanded="false"
          aria-controls="sideNav" data-testid="admin-menu-toggle"><span></span><span></span><span></span></button>
      </div>
      <nav class="side-nav" id="sideNav">
        <button data-view="dashboard" class="active" data-testid="admin-nav-dashboard"><i
            class="bi bi-microsoft"></i>Kezelőpult</button>
        <button data-view="bookings" data-testid="admin-nav-bookings"><i class="bi bi-map"></i>Térkép</button>
        <button data-view="bookings" data-testid="admin-nav-bookings"><i class="bi bi-scooter"></i>Járművek</button>
        <button data-view="calendar" data-testid="admin-nav-calendar"><i class="bi bi-compass"></i>Útvonal
          tervezés</button>
        <button data-view="tickets" data-testid="admin-nav-tickets"><i class="bi bi-wrench-adjustable"></i>Szervíz <span
            class="badge hidden" id="ticketBadge"></span></button>
        <button data-view="inventory" data-testid="admin-nav-inventory"><i class="bi bi-bell"></i>Értesítések <span
            class="badge warn hidden" id="stockBadge"></span></button>
      </nav>
      <div class="side-foot">
        <div class="dropdown showOnMobile">
          <button class="btn dropdown-toggle p-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle pe-2"></i>Profile</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </div>
        <button id="logoutBtn" class="link-line" data-testid="admin-logout-btn">
          <i class="bi bi-box-arrow-right"></i>Kilépés</button>
      </div>
    </aside>
    <div>
      <header class="topbar hideOnMobile">
        <h1 id="viewTitle">Kezelőpult</h1>
        <div class="text-end">
          <div class="d-inline-flex p-2">
            <div class="d-flex justify-content-between ">
              <i class="bi bi-chat-left-dots mt-2"></i>
              <i class="bi bi-bell mx-5 mt-2"></i>
              <div class="dropdown">
                <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-person-circle pe-2"></i>Profile</button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Action</a></li>
                  <li><a class="dropdown-item" href="#">Another action</a></li>
                  <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </header>
      <main class="szurkeHatter">
        <section id="view" class="view">
          <div class="row">
            <div class="col-lg-4">
                <div class="card p-3 rounded-4 border-none" style="max-width: 420px;">
                  <div class="card-body">
                    <p class="card-subtitle fg-3 pb-4">Összes rollerünk <br><span class="osszes"></span></p>
                    <div class="card-text">
                      <div class="d-flex le justify-content-between">
                        <p><span class="elerheto text-success"></span> <br>Elérhető</p>
                        <p><span class="tolton text-warning"></span> <br>Töltőn</p>
                      </div>
                      <p><span class="alacsonyEnergia text-warning"></span> <br>Alacsony energiaszint</p>
                      <p><span class="szervizben text-danger"></span> <br>Szervízben</p>
                    </div>
                  </div>
                </div>
            </div>
            <div class="col-lg-8">
              <div id="map"></div>
            </div>
          </div>
        </section>
        <section class="eredmeny p-5 pt-0">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th class="hideOnMobile" scope="col">Model</th>
                <th scope="col">Töltöttség</th>
                <th class="hideOnMobile" scope="col">Állapot</th>
                <th scope="col">Hely</th>
                <th class="hideOnMobile" scope="col">IdejeAktiv</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/Roller.js"></script>
  <script src="js/all.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
